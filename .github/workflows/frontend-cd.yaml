name: Frontend CD

on:
	push:
		branches:
			- main
		paths:
			- starter/frontend/**
	workflow_dispatch:

env:
	AWS_REGION: us-east-1
	ECR_REPOSITORY: frontend
	EKS_CLUSTER: cluster

defaults:
	run:
		working-directory: starter/frontend

jobs:
	lint:
		runs-on: ubuntu-latest
		steps:
			- uses: actions/checkout@v4
			- uses: actions/setup-node@v4
				with:
					node-version-file: starter/frontend/.nvmrc
					cache: npm
					cache-dependency-path: starter/frontend/package-lock.json
			- run: npm ci
			- run: npm run lint

	test:
		runs-on: ubuntu-latest
		steps:
			- uses: actions/checkout@v4
			- uses: actions/setup-node@v4
				with:
					node-version-file: starter/frontend/.nvmrc
					cache: npm
					cache-dependency-path: starter/frontend/package-lock.json
			- run: npm ci
			- run: npm test
				env:
					CI: true

	build:
		runs-on: ubuntu-latest
		needs:
			- lint
			- test
		outputs:
			image_uri: ${{ steps.image.outputs.image_uri }}
		steps:
			- uses: actions/checkout@v4
			- uses: aws-actions/configure-aws-credentials@v4
				with:
					aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
					aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
					aws-region: ${{ env.AWS_REGION }}
			- uses: aws-actions/amazon-ecr-login@v2
				id: ecr
			- name: Build and push image
				id: image
				env:
					REGISTRY: ${{ steps.ecr.outputs.registry }}
					IMAGE_TAG: ${{ github.sha }}
				run: |
					IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
					docker build --build-arg=REACT_APP_MOVIE_API_URL=http://localhost:5000 --tag="$IMAGE_URI" .
					docker push "$IMAGE_URI"
					echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

	deploy:
		runs-on: ubuntu-latest
		needs: build
		steps:
			- uses: actions/checkout@v4
			- uses: aws-actions/configure-aws-credentials@v4
				with:
					aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
					aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
					aws-region: ${{ env.AWS_REGION }}
			- uses: azure/setup-kubectl@v4
			- uses: imranismail/setup-kustomize@v2
			- name: Configure Kubernetes access
				run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
			- name: Apply Kubernetes manifests
				working-directory: starter/frontend/k8s
				env:
					IMAGE_URI: ${{ needs.build.outputs.image_uri }}
				run: |
					kustomize edit set image frontend="$IMAGE_URI"
					kustomize build | kubectl apply -f -
